<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安妮塔·约翰逊的故事</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .image-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .image-container {
            text-align: center;
            margin-bottom: 15px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .quote {
            font-size: 16px;
            line-height: 1.8;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .quote-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .author {
            text-align: right;
            font-style: italic;
            margin-top: 15px;
            color: #666;
        }
        .photo-credit {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }
        .audio-section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .audio-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            font-weight: 500;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .audio-credit {
            font-size: 14px;
            color: #888;
            text-align: right;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>安妮塔·约翰逊的故事</h1>
        </div>
        
        <!-- 图片卡片 -->
        <div class="image-card">
            <div class="image-container">
                <img src="安妮塔·约翰逊.jpg" alt="安妮塔·约翰逊">
            </div>
            <div class="photo-credit">拍摄：周小平，2023年</div>
            
            <div class="quote">
                <div class="quote-title">就像一个"局外人"</div>
                <p>"我既有原住民血统，也有中国人血统，在原住民学校的那些年里，我感觉自己像个'局外人'。当时我并不喜欢被称为'华人'，因为我认为自己是原住民。我曾经用化妆来掩饰我的华人相貌特征。但随着我长大了，开始珍惜自己所拥有的这两种文化。"</p>
                <div class="author">——安妮塔·约翰逊</div>
            </div>
        </div>
        
        <!-- 语音部分 -->
        <div class="audio-section">
            <div class="audio-title">聆听安妮塔的故事</div>
            <p>点击下方播放按钮，收听安妮塔·约翰逊关于双重文化身份的完整讲述。</p>
            <audio controls>
                <source src="声音：周小平.m4a" type="audio/mpeg">
                您的浏览器不支持音频元素。
            </audio>
            <div class="audio-credit">声音：周小平</div>
        </div>
    </div>
</body>
</html>
